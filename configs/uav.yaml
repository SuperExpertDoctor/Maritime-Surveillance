count_max: 10
cruise_speed_kmh: 160
endurance_h: 30
# Operational sortie cap; physical platform endurance remains 30 h.
sortie_endurance_h: 8.0
refuel_time_min: 3
# Keep the main force on the offshore coverage mission until the whole
# searchable sea has received a pass.  A partial-coverage handoff pulls
# aircraft back to the coast while aging black-situation pockets remain.
# Recovery still uses the real land bases on a true fuel/reserve trigger.
lifecycle_rotation_start_min: 120
lifecycle_coverage_threshold_pct: 100
lifecycle_search_dwell_min: 5
lifecycle_candidate_max_distance_cells: 12
lifecycle_required_cycles: 3
# Once broad initial reconnaissance is underway, keep a subset of the fleet
# on its LLM-approved regions for short revisit cycles while the remainder
# continues expanding unique coverage.
freshness_patrol_start_min: 120
freshness_patrol_count: 5
# Do not reserve aircraft for local revisits until the first broad search
# pass is complete.  Before this gate, every completed sector returns to the
# exploration pool so unique offshore coverage can reach the 8-hour target.
freshness_patrol_coverage_threshold_pct: 80
