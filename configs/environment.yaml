sea_area_km: [300, 300]
# Retained as the V1-compatible default and initial StateManager position.
# The operational base is generated on the coastline on each engine reset.
base_position: [2, 14]
base_count: 2
base_capacity: 3
base_min_distance_cells: 5
base_land_margin: 0
# The provided chart places the mainland on the left edge of the map.
mainland_width_cells: 5
base_task_min_distance_cells: 3
base_obstacle_clearance_cells: 4
# Open-water default: sparse 10--20 km islands and thunderstorms.
island_count_min: 0
island_count_max: 2
thunderstorm_count_min: 2
thunderstorm_count_max: 3
storm_safety_margin_cells: 1.0

grid:
  resolution: [30, 30]
  cell_size_km: 10
  decay_half_life_min: 30
  track_decay_half_life_min: 15
  white_threshold: 0.7
  gray_threshold: 0.2
  value_alpha: 1.0
  value_beta: 0.8
  value_gamma: 0.5
  marker_sigma_cells: 1.5
  marker_max_age_min: 60
  marker_decay_half_life_min: 45
  candidate_value_threshold: 0.3
  fragment_threshold_cells: 12
  track_min_cells: 6
  track_max_cells: 16
  search_min_cells: 20
  search_max_cells: 48
  aspect_ratio_max: 2.0
  stability_iou_threshold: 0.7
