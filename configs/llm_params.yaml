# LLM Provider, Model, and Binding Configuration
# API keys are stored in configs/.env (git-ignored)

providers:
  - name: longcat
    api_base: https://api.longcat.chat/openai/v1
    api_key_env: LONGCAT_API_KEY
    supports_json_mode: false

models:
  - id: LongCat-2.0
    name: LongCat 2.0
    provider: longcat
    max_tokens: 131072

bindings:
  decision_maker:
    model: LongCat-2.0
    temperature: 0.3
    max_tokens: 2048
    thinking: disabled
  reviewer:
    model: LongCat-2.0
    temperature: 0.3
    max_tokens: 512
    thinking: disabled

cycles:
  heavy_cycle_min: 30
  reviewer_cycle_min: 15
  max_retries: 2
